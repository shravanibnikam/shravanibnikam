<svg xmlns="http://www.w3.org/2000/svg" width="836" height="492" viewBox="0 0 836 492" role="img" aria-labelledby="t d"><title id="t">hallucination-hunter</title><desc id="d">Hallucination Hunter (study in progress): a web game and human-evaluation study on whether people can spot fabricated facts in AI answers. Between-session random assignment to paired or single answers; measures accuracy, confidence calibration and per-category accuracy; scoring is server-side.</desc><style>@font-face{font-family:mono;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:mono;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}.m{font-family:mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-ligatures:none}
