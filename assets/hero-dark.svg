<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="452" viewBox="0 0 1200 452" role="img" aria-labelledby="t d"><title id="t">Shravani Nikam: backend, machine learning, data science</title><desc id="d">MS in Computer Science at Northeastern University, Seattle, graduating December 2027. Open to a co-op in Spring/Summer 2027 and full-time from January 2028. Backend: PostgreSQL, indexing and query plans, offline-first sync, REST APIs. ML/AI: NLP, BERT pipelines, LLM evaluation, open-source ML infrastructure. Data: experiment design, benchmarking, BigQuery pipelines, pandas.</desc><style>@font-face{font-family:mono;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:mono;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}.m{font-family:mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-ligatures:none}
