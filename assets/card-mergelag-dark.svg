<svg xmlns="http://www.w3.org/2000/svg" width="836" height="492" viewBox="0 0 836 492" role="img" aria-labelledby="t d"><title id="t">mergelag</title><desc id="d">MergeLag (in development): predicts pull-request merge time. Pipeline from GH Archive through priced BigQuery queries (built) to point-in-time features, a merge-time model and a weekly digest (planned), with guards against leakage, unpriced queries and secrets in logs.</desc><style>@font-face{font-family:mono;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:mono;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}.m{font-family:mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-ligatures:none}
