<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="166" viewBox="0 0 1200 166" role="img" aria-labelledby="t d"><title id="t">Highlights</title><desc id="d">30% lower average response time after rebuilding intent classification (AI/ML intern, IBM SkillsBuild). 7k+ reviews scored per aspect by a BERT pipeline (IRJMETS paper). 28.4% less query time from a 10 MB partial index versus a 404 MB covering index (query-plan-lab). 200+ students taught GCP and 15 juniors mentored (GDG Cloud Co-Lead).</desc><style>@font-face{font-family:mono;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:mono;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}.m{font-family:mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-ligatures:none}
