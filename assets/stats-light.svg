<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="214" viewBox="0 0 1200 214" role="img" aria-labelledby="t d"><title id="t">Highlights</title><desc id="d">28.4% less query time from a 10 MB partial index versus a 404 MB covering index (query-plan-lab). 30% lower average response time after rebuilding intent classification (AI/ML intern, IBM SkillsBuild, 2024). 200+ students taught GCP and 15 juniors mentored as GDG Cloud Co-Lead, 2022–2025. Open to a co-op in Spring/Summer 2027 and full-time from January 2028.</desc><style>@font-face{font-family:vt;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:mono;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.d{font-family:vt,monospace}
