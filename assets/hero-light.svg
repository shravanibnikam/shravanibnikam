<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="446" viewBox="0 0 1200 446" role="img" aria-labelledby="t d"><title id="t">Shravani Nikam: backend, machine learning, data science</title><desc id="d">MS in Computer Science at Northeastern University, Seattle. Open to a co-op in Spring/Summer 2027. backend: PostgreSQL · query planning &amp; indexing · offline-first sync · REST APIs. ml / ai: NLP · BERT pipelines · LLM agents &amp; evaluation · open-source ML infra. data: experiment design · benchmarking · BigQuery, DuckDB &amp; Polars pipelines. Currently: running a human-eval study on how people catch LLM hallucinations; contributing to ML infra: DeepSpeed (merged), PyTorch (open PR); building MergeLag: predicting PR merge times from GH Archive; benchmarking PostgreSQL index strategies on 10M rows.</desc><style>@font-face{font-family:mono;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:mono;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}.m{font-family:mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-ligatures:none}
