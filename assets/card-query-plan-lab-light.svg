<svg xmlns="http://www.w3.org/2000/svg" width="836" height="492" viewBox="0 0 836 492" role="img" aria-labelledby="t d"><title id="t">query-plan-lab</title><desc id="d">query-plan-lab: eight PostgreSQL 16 index strategies on 10M rows. A 10 MB partial index ran q1 in 71.95 ms versus 100.53 ms for a 404 MB covering index; GIN made the common JSONB probe 22.5% slower.</desc><style>@font-face{font-family:mono;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:mono;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}.m{font-family:mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-ligatures:none}
