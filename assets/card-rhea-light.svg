<svg xmlns="http://www.w3.org/2000/svg" width="836" height="492" viewBox="0 0 836 492" role="img" aria-labelledby="t d"><title id="t">rhea</title><desc id="d">Rhea: local-first cycle tracker with partner sharing. Edits made offline on two devices converge through a hybrid logical clock and a last-write-wins merge.</desc><style>@font-face{font-family:mono;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:mono;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}.m{font-family:mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-ligatures:none}
